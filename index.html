<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إختبار تطبيقات الهاتف المحمول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            width: 100%;
            max-width: 500px;
            background-color: #111827;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .header-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .counters {
            display: flex;
            gap: 10px;
        }
        .counter {
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .counter.correct-count { background-color: #065f46; color: #34d399; }
        .counter.wrong-count { background-color: #7f1d1d; color: #f87171; }
        .progress-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            justify-content: flex-end;
        }
        .progress-text {
            font-size: 16px;
            color: #9ca3af;
            font-weight: 500;
        }
        .progress-bar-container {
            width: 100px;
            height: 8px;
            background-color: #374151;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #6366f1;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
            direction: ltr;
            min-height: 80px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .option-btn {
            background-color: #1f2937;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            direction: ltr;
            color: #e5e7eb;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #374151;
        }
        .option-btn.selected {
            border-color: #6366f1;
            background-color: #312e81;
        }
        .option-btn.correct-visual {
            background-color: #065f46;
            color: #34d399;
        }
        .option-btn.wrong-visual {
            background-color: #7f1d1d;
            color: #f87171;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-next {
            background-color: #a5b4fc;
            color: #1e1b4b;
        }
        .btn-next:hover { background-color: #818cf8; }
        .btn-prev {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
        }
        .btn-prev:hover { background-color: #1f2937; }
        
        .result-screen {
            text-align: center;
            padding: 20px 0;
        }
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: #6366f1;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- شاشة الإختبار الرئيسي -->
    <div id="quiz-screen">
        <div class="header-stats">
            <div class="counters">
                <div class="counter correct-count"><span id="correct-label">0</span> ✓</div>
                <div class="counter wrong-count"><span id="wrong-label">0</span> ✕</div>
            </div>
            <div class="progress-section">
                <span class="progress-text"><span id="current-idx-text">1</span> / <span id="total-text">78</span></span>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="question-text" id="question-text">جاري تحميل السؤال...</div>
        
        <div class="options-container" id="options-container"></div>

        <div class="nav-buttons">
            <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">التالي</button>
            <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()">رجوع</button>
        </div>
    </div>

    <!-- شاشة النتيجة النهائية -->
    <div id="result-screen" class="result-screen" style="display: none;">
        <h2>النتيجة النهائية للاختبار</h2>
        <div class="result-score" id="final-score">0 / 78</div>
        <p id="result-comment" style="color: #9ca3af; font-size: 16px;"></p>
        <button class="btn btn-next" onclick="restartQuiz()" style="margin-top: 20px;">إعادة الاختبار</button>
    </div>
</div>
