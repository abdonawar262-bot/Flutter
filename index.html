<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Mobile Applications</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .progress-box {
            color: var(--text-muted);
        }

        .score-boxes {
            display: flex;
            gap: 8px;
        }

        .score-tag {
            padding: 4px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .score-tag.correct { background-color: var(--success); }
        .score-tag.wrong { background-color: var(--error); }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .lecture-badge {
            align-self: flex-start;
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.07);
            border-color: var(--text-muted);
        }

        .option-btn.correct-ans {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
        }

        .option-btn.wrong-ans {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
        }

        .nav-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }

        .score-circle .percentage {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .score-circle .ratio {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .summary-text {
            font-size: 1rem;
            margin-bottom: 25px;
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bank of Mobile Applications</h1>
        <p>DR/Abeer Bedeir • 2025/2026</p>
    </header>

    <div class="quiz-container" id="quiz-box">
        <!-- الواجهة التفاعلية للأسئلة -->
        <div id="question-screen">
            <div class="stats-bar">
                <div class="progress-box" id="progress-text">سؤال 1 / 84</div>
                <div class="score-boxes">
                    <div class="score-tag correct" id="correct-count">✔ 0</div>
                    <div class="score-tag wrong" id="wrong-count">✖ 0</div>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="bar-fill"></div>
            </div>

            <div class="lecture-badge" id="lecture-title">Lecture 1</div>
            <div class="question-text" id="question-body">جاري تحميل السؤال...</div>

            <div class="options-container" id="options-box">
                <!-- الأزرار هتتولد هنا بالجافا سكريبت -->
            </div>

            <button class="nav-btn" id="next-btn" disabled onclick="nextQuestion()">السؤال التالي</button>
        </div>

        <!-- واجهة النتيجة النهائية -->
        <div class="result-screen" id="result-screen">
            <h2>🎉 اكتمل الاختبار!</h2>
            <div class="score-circle">
                <div class="percentage" id="final-percent">0%</div>
                <div class="ratio" id="final-ratio">0 / 0</div>
            </div>
            <p class="summary-text" id="final-summary">لقد أتممت مراجعة بنك الأسئلة لمادة تطبيقات الموبايل بنجاح.</p>
            <button class="nav-btn" onclick="resetQuiz()">إعادة الاختبار من جديد</button>
        </div>
    </div>

            { lec: "Lecture 6", type: "TF", q: "Int is the data type accepted by the current index property.", answers: ["True (صح)", "False (خطأ)"], correct: 0 },
            { lec: "Lecture 6", type: "TF", q: "Leading Padding allows you to define the horizontal area with the front element.", answers: ["True (صح)", "False (خطأ)"], correct: 1 },
            { lec: "Lecture 6", type: "TF", q: "The Prefix Icon appears at the beginning of the field before the input text.", answers: ["True (صح)", "False (خطأ)"], correct: 0 },
            { lec: "Lecture 6", type: "TF", q: "One of the available cases for the brightness in AppBar feature are Dark and Light.", answers: ["True (صح)", "False (خطأ)"], correct: 0 },
            { lec: "Lecture 6", type: "TF", q: "Translating animation is used to rotate the object around its axis.", answers: ["True (صح)", "False (خطأ)"], correct: 1 }
        ];

        let currentIndex = 0;
        let correctScore = 0;
        let wrongScore = 0;
        let optionSelected = false;

        // استدعاء العناصر من الـ DOM
        const progressText = document.getElementById("progress-text");
        const correctCount = document.getElementById("correct-count");
        const wrongCount = document.getElementById("wrong-count");
        const barFill = document.getElementById("bar-fill");
        const lectureTitle = document.getElementById("lecture-title");
        const questionBody = document.getElementById("question-body");
        const optionsBox = document.getElementById("options-box");
        const nextBtn = document.getElementById("next-btn");

        const questionScreen = document.getElementById("question-screen");
        const resultScreen = document.getElementById("result-screen");
        const finalPercent = document.getElementById("final-percent");
        const finalRatio = document.getElementById("final-ratio");

        // دالة تشغيل وعرض السؤال الحالي
        function loadQuestion() {
            optionSelected = false;
            nextBtn.disabled = true;
            optionsBox.innerHTML = "";

            if (currentIndex >= quizData.length) {
                showResults();
                return;
            }

            const currentData = quizData[currentIndex];

            // تحديث شريط البيانات العلوي
            progressText.textContent = `سؤال ${currentIndex + 1} / ${quizData.length}`;
            lectureTitle.textContent = currentData.lec;
            questionBody.textContent = currentData.q;

            // حساب ورسم نسبة شريط التقدم الأزرق
            const progressPercent = ((currentIndex) / quizData.length) * 100;
            barFill.style.width = `${progressPercent}%`;

            // بناء أزرار الخيارات التفاعلية
            currentData.answers.forEach((ans, index) => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.textContent = ans;
                button.onclick = () => checkAnswer(index, button);
                optionsBox.appendChild(button);
            });
        }

        // دالة التحقق من صحة الإجابة وضبط الألوان التفاعلية فوراً
        function checkAnswer(selectedIndex, clickedButton) {
            if (optionSelected) return; // منع الضغط المتعدد
            optionSelected = true;

            const currentData = quizData[currentIndex];
            const allButtons = optionsBox.querySelectorAll(".option-btn");

            // تعطيل كافة الأزرار فور الضغط
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentData.correct) {
                // إجابة صحيحة
                clickedButton.classList.add("correct-ans");
                correctScore++;
                correctCount.textContent = `✔ ${correctScore}`;
            } else {
                // إجابة خاطئة
                clickedButton.classList.add("wrong-ans");
                // إظهار الإجابة الصحيحة بلونها الأخضر للمساعدة في المذاكرة
                allButtons[currentData.correct].classList.add("correct-ans");
                wrongScore++;
                wrongCount.textContent = `✖ ${wrongScore}`;
            }

            nextBtn.disabled = false;
        }

        // الانتقال للسؤال التالي
        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        // عرض الشاشة النهائية وحساب الإحصائيات
        function showResults() {
            questionScreen.style.display = "none";
            resultScreen.style.display = "block";
            barFill.style.width = "100%";

            const percentage = Math.round((correctScore / quizData.length) * 100);
            finalPercent.textContent = `${percentage}%`;
            finalRatio.textContent = `${correctScore} / ${quizData.length}`;
        }

        // إعادة تشغيل الاختبار من الصفر
        function resetQuiz() {
            currentIndex = 0;
            correctScore = 0;
            wrongScore = 0;
            correctCount.textContent = "✔ 0";
            wrongCount.textContent = "✖ 0";
            resultScreen.style.display = "none";
            questionScreen.style.display = "block";
            loadQuestion();
        }

        // تشغيل التطبيق تلقائياً عند الفتح
        window.onload = loadQuestion;
    </script>
</body>
</html>
